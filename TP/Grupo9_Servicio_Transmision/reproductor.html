<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>UADE Beats - Transmision</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
               font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8eaf0; }

  /* El video ocupa toda la pantalla. */
  #marco { position: fixed; inset: 0; background: #000; }
  #video, #reproductor, #reproductor iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #video { object-fit: contain; display: none; }

  /* Capa transparente: bloquea clics y atajos sobre el video (pausa, adelantar). */
  #escudo { position: absolute; inset: 0; z-index: 5; }

  #cabecera { position: absolute; z-index: 8; top: 0; left: 0; right: 0; padding: 14px 20px;
              display: flex; align-items: center; gap: 12px;
              background: linear-gradient(rgba(0,0,0,.7), transparent); pointer-events: none;
              transition: opacity .6s; }
  .marca { font-weight: 800; letter-spacing: .5px; color: #7aa2ff; }
  .vivo { background: #e5293e; color: #fff; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 4px;
          animation: latido 1.6s infinite; }
  .vivo.fin { background: #555; animation: none; }
  @keyframes latido { 50% { opacity: .55; } }
  #titulo { font-size: 16px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #reloj-caja { font-size: 13px; color: #c5cbdb; font-variant-numeric: tabular-nums; }

  #sonido { position: absolute; z-index: 10; left: 50%; bottom: 7vh; transform: translateX(-50%);
            background: #7aa2ff; color: #0b0d14; border: 0; border-radius: 999px; padding: 13px 26px;
            font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #mensaje { position: absolute; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center;
             flex-direction: column; text-align: center; padding: 30px; background: rgba(8,10,16,.94); font-size: 24px; }
  #mensaje a { color: #7aa2ff; }
</style>
</head>
<body>
<div id="marco">
  <video id="video" playsinline disablepictureinpicture controlslist="nodownload noremoteplayback noplaybackrate"
         oncontextmenu="return false"></video>
  <div id="reproductor"></div>
  <div id="escudo" oncontextmenu="return false"></div>

  <div id="cabecera">
    <span class="marca">UADE BEATS</span>
    <span class="vivo" id="etiqueta">EN VIVO</span>
    <span id="titulo"></span>
    <span id="reloj-caja">minuto <span id="reloj">0:00</span></span>
  </div>

  <div id="mensaje"></div>
  <button id="sonido" hidden>Activar sonido y pantalla completa</button>
</div>

<script>
  // Parametros: src = video propio (archivo de media/), v = video de YouTube,
  // alt = videos de reserva, inicio = cuando empezo el evento (ms), e = espectador.
  const params = new URLSearchParams(location.search);
  const src = params.get("src");
  const videos = [params.get("v"), ...(params.get("alt") || "").split(",")].filter(Boolean);
  const inicio = Number(params.get("inicio"));
  const espectador = params.get("e");
  document.getElementById("titulo").textContent = params.get("titulo") || "";

  let desfase = 0;          // diferencia entre el reloj del servidor y el de esta pagina
  let jugador = null;       // { tiempo, duracion, reproduciendo, reproducir, ir, activarSonido, destruir }
  let terminado = false;
  let horaLista = false;
  const errores = [];       // codigos de error del reproductor, para diagnostico

  // Segundos que deberia llevar la transmision: ahora menos el inicio del evento.
  const esperado = () => Math.max(0, (Date.now() + desfase - inicio) / 1000);

  const formato = (s) => {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), seg = s % 60;
    const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(seg).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  };

  function mostrar(texto) {
    const caja = document.getElementById("mensaje");
    caja.textContent = texto;
    caja.style.display = texto ? "flex" : "none";
  }

  function detener(etiqueta, texto) {
    terminado = true;
    if (jugador) jugador.destruir();
    document.getElementById("etiqueta").textContent = etiqueta;
    document.getElementById("etiqueta").classList.add("fin");
    document.getElementById("sonido").hidden = true;
    mostrar(texto);
    clearInterval(latido);
  }

  // ---------- video propio: etiqueta <video> con el archivo servido por este servicio ----------

  function jugadorPropio() {
    const video = document.getElementById("video");
    video.style.display = "block";
    video.src = "/media/" + encodeURIComponent(src);
    video.muted = true;
    video.addEventListener("loadedmetadata", () => { video.currentTime = Math.min(esperado(), video.duration || esperado()); video.play(); });
    video.addEventListener("error", () => { detener("ERROR", "No se pudo reproducir la transmision."); });
    video.addEventListener("ended", () => detener("FINALIZADO", "La transmision finalizo."));

    jugador = {
      tiempo: () => video.currentTime,
      duracion: () => video.duration || 0,
      reproduciendo: () => !video.paused && !video.ended && video.readyState > 2,
      reproducir: () => video.play(),
      ir: (t) => { video.currentTime = t; },
      activarSonido: () => { video.muted = false; video.volume = 1; },
      destruir: () => { video.pause(); video.removeAttribute("src"); video.load(); video.style.display = "none"; },
    };
    document.getElementById("sonido").hidden = false;
  }

  // ---------- YouTube: reproductor incrustado ----------

  let apiLista = false, indice = 0, yt = null;

  function jugadorYoutube() {
    if (!apiLista || yt) return;

    yt = new YT.Player("reproductor", {
      videoId: videos[indice],
      playerVars: {
        autoplay: 1, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0,
        iv_load_policy: 3, playsinline: 1, start: Math.floor(esperado()), origin: location.origin,
      },
      events: {
        // Los navegadores solo dejan reproducir solo si esta silenciado.
        onReady: (e) => { e.target.mute(); e.target.playVideo(); document.getElementById("sonido").hidden = false; },
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) detener("FINALIZADO", "La transmision finalizo."); },
        onError: (e) => {
          errores.push(videos[indice] + ":" + e.data);
          fetch("/fallo?v=" + encodeURIComponent(videos[indice])).catch(() => {});
          siguienteVideo();
        },
      },
    });

    jugador = {
      tiempo: () => yt.getCurrentTime(),
      duracion: () => (yt.getDuration ? yt.getDuration() : 0),
      reproduciendo: () => yt.getPlayerState() === YT.PlayerState.PLAYING,
      reproducir: () => {
        const e = yt.getPlayerState();
        if (e === YT.PlayerState.PAUSED || e === YT.PlayerState.CUED) yt.playVideo();
      },
      ir: (t) => yt.seekTo(t, true),
      activarSonido: () => { yt.unMute(); yt.setVolume(100); },
      destruir: () => { if (yt.destroy) yt.destroy(); },
    };
  }

  // Pasa al siguiente video cuando el actual no se puede reproducir incrustado.
  function siguienteVideo() {
    indice++;
    if (indice >= videos.length) { sinReproduccion(); return; }
    yt.loadVideoById({ videoId: videos[indice], startSeconds: esperado() });
  }

  function sinReproduccion() {
    const caja = document.getElementById("mensaje");
    caja.innerHTML = "Ningun recital de este artista permite reproducirse fuera de YouTube.<br><br>"
      + "Con una clave de la API de YouTube el servicio busca solo los que si lo permiten.";
    caja.style.display = "flex";
  }

  window.onYouTubeIframeAPIReady = () => { apiLista = true; iniciar(); };

  // ---------- comun ----------

  function iniciar() {
    if (!horaLista || jugador) return;

    if (src) jugadorPropio();
    else jugadorYoutube();

    // Cada segundo: mantiene el video en el minuto que corresponde.
    setInterval(() => {
      if (terminado || !jugador) return;

      const meta = esperado();
      document.getElementById("reloj").textContent = formato(meta);

      const duracion = jugador.duracion();
      if (duracion > 0 && meta >= duracion) { detener("FINALIZADO", "La transmision finalizo."); return; }

      if (!jugador.reproduciendo()) jugador.reproducir();

      // Si se adelanto o atraso (o el video se trabo), vuelve al minuto del directo.
      if (jugador.reproduciendo() && Math.abs(jugador.tiempo() - meta) > 4) jugador.ir(meta);
    }, 1000);
  }

  // Hora del servidor, para no depender de que el reloj de esta PC este bien.
  fetch("/hora").then((r) => r.json()).then((d) => {
    desfase = d.ahora - Date.now();
    horaLista = true;
    iniciar();
  });

  // El clic habilita el sonido y la pantalla completa (los navegadores lo exigen).
  document.getElementById("sonido").addEventListener("click", (e) => {
    jugador.activarSonido();
    e.target.hidden = true;
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });

  // Latido: avisa al servicio que esta pagina sigue abierta. Si la persona salio del evento,
  // el servicio responde que ya no esta vigente y se detiene el video.
  let fallos = 0;

  const latido = espectador ? setInterval(() => {
    fetch("/latido?e=" + encodeURIComponent(espectador))
      .then((r) => r.json())
      .then((d) => { fallos = 0; if (!d.vigente && !terminado) detener("FINALIZADO", "Saliste del evento. La transmision se cerro."); })
      .catch(() => {
        // Sin respuesta del servicio (por ejemplo, el programa se cerro): se corta.
        if (++fallos >= 3 && !terminado) detener("FINALIZADO", "Se perdio la conexion con el servicio.");
      });
  }, 4000) : null;

  // Sin atajos de teclado.
  document.addEventListener("keydown", (e) => e.preventDefault());

  if (!src) {
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
</script>
</body>
</html>
